<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>LinkedIn TL;DR</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">TL</div>
      <div><p class="eyebrow">PRIVATE WORKSPACE</p><h1>LinkedIn TL;DR</h1></div>
      <span class="local-pill"><i></i> Local</span>
    </header>
    <p class="intro">Turn a long post into the point, without the noise.</p>

    <section class="input-section">
      <div class="section-heading"><label for="postText">Post content</label><button id="clearBtn" class="text-button" type="button">Clear</button></div>
      <textarea id="postText" maxlength="20000" placeholder="Paste the post text here…" spellcheck="true"></textarea>
      <div class="input-meta"><span id="charCount">0 / 20,000</span><span>Only text you submit is sent</span></div>
    </section>

    <section class="controls" aria-label="Summary preferences">
      <div><label for="length">Summary length</label><select id="length"><option value="concise">Concise</option><option value="standard" selected>Standard</option><option value="detailed">Detailed</option></select></div>
      <div><label for="tone">Writing style</label><select id="tone"><option value="neutral" selected>Neutral</option><option value="technical">Technical</option></select></div>
    </section>

    <button id="summarizeBtn" class="primary" type="button"><span class="button-label">Summarize post</span><span class="spinner" hidden></span></button>
    <p id="status" class="status" role="status" aria-live="polite">Ready when you are.</p>

    <section id="resultSection" class="result-section" hidden>
      <div class="result-top"><div><p class="eyebrow">YOUR QUICK READ</p><h2>Summary</h2></div><button id="copyBtn" class="secondary" type="button">Copy summary</button></div>
      <div id="result" class="result"></div>
      <div class="result-meta"><span id="resultInfo"></span><button id="copySourceBtn" class="text-button" type="button">Copy original text</button></div>
    </section>
    <footer><span>Manual input only</span><span>·</span><span>No LinkedIn page access</span></footer>
  </main>
  <script src="popup.js" type="module"></script>
</body>
</html>
